name: Backend CI/CD

on:
  push:
    branches: [main]
    paths: ["backend-spring/**", "render.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend-spring/**"]

jobs:
  test:
    name: Tests Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring/technology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - name: Build de l'image Docker (même image que Render)
        run: docker build -t ipnet-event-backend .

  # Le déploiement est fait par Render (autoDeployTrigger: checksPass) : il part automatiquement
  # dès que « Tests Maven » est vert sur main. Rien d'autre à configurer côté GitHub.
