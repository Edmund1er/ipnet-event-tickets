name: Keep alive (Render)

# Render (offre gratuite) endort le service après 15 min sans requête.
# Ce ping toutes les 5 min le garde éveillé. Lançable aussi à la main (Actions > Keep alive > Run workflow).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping du backend
        run: |
          curl --fail --silent --show-error --location \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://ipnet-event-tickets.onrender.com/v3/api-docs
