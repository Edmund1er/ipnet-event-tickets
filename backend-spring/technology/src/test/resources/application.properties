# Configuration H2 pour les tests automatisés
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.security.jwt.secret=ipnet_billetterie_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256!
app.security.qr.hmac-secret=ipnet_billetterie_super_secret_hmac_key_2026_safe_protection
app.stockage.preuves.chemin=./target/test-uploads
