spring.application.name=IPNET_EVENT_APP
spring.profiles.include=local
server.port=8081

# Configuration locale (SMTP, administrateur, numéro de paiement…) : fichier .env non versionné
# placé à côté de ce projet (voir .env.example). Les variables d'environnement restent prioritaires.
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# ==========================================
# BASE DE DONNÉES & POOL HIKARI
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ipnet_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# FLYWAY & JPA
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SÉCURITÉ & SECRETS (Section 5.3 OWASP)
# ==========================================
app.security.jwt.secret=${JWT_SECRET:ipnet_billetterie_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256!}
app.security.qr.hmac-secret=${QR_HMAC_SECRET:ipnet_billetterie_super_secret_hmac_key_2026_safe_protection}

# Cookie du refresh token : Secure (true en prod ; localhost est accepté par les navigateurs en http)
app.security.cookie.secure=${COOKIE_SECURE:true}

# ==========================================
# FRONT-END / CORS
# ==========================================
# Origines autorisées (séparées par des virgules) et URL publique du front (liens dans les e-mails)
app.cors.origines=${CORS_ORIGINES:http://localhost:5173}
app.front.url=${FRONT_URL:http://localhost:5173}

# ==========================================
# ADMINISTRATEUR INITIAL (facultatif)
# ==========================================
# Sans ces trois valeurs, le premier lancement affiche un code d'installation et la page /installation
# permet de créer le compte administrateur. Aucune valeur par défaut.
app.admin.email=${ADMIN_EMAIL:}
app.admin.telephone=${ADMIN_TELEPHONE:}
app.admin.mot-de-passe=${ADMIN_PASSWORD:}

# ==========================================
# PAIEMENT MOBILE MONEY (EF-07)
# ==========================================
# Le numéro est saisi et modifié par l'administrateur (Administration > Paramètres).
# Valeur initiale facultative ; aucune valeur par défaut.
app.paiement.numero=${PAIEMENT_NUMERO:}
app.paiement.titulaire=${PAIEMENT_TITULAIRE:}

# ==========================================
# NUMÉROS DE TÉLÉPHONE (RG-02) — métadonnées libphonenumber
# ==========================================
# Région utilisée pour les saisies sans indicatif (TG = Togo, +228)
app.telephone.region-par-defaut=${TELEPHONE_REGION:TG}
# Pays acceptés (codes ISO séparés par des virgules ; vide = tous les pays)
app.telephone.regions-autorisees=${TELEPHONE_REGIONS_AUTORISEES:}
# Types de ligne acceptés par usage (MOBILE, FIXED_LINE, FIXED_LINE_OR_MOBILE, VOIP…)
app.telephone.types.COMPTE=MOBILE,FIXED_LINE_OR_MOBILE,FIXED_LINE
app.telephone.types.MOBILE_MONEY=MOBILE,FIXED_LINE_OR_MOBILE

# ==========================================
# ADRESSES E-MAIL (RG-01)
# ==========================================
# Vérifie que le domaine reçoit des e-mails (DNS MX) avant d'envoyer le code de confirmation
app.email.verifier-domaine=${EMAIL_VERIFIER_DOMAINE:true}
app.email.dns-timeout-ms=3000

# ==========================================
# IMAGES D'ÉVÉNEMENT (EF-10)
# ==========================================
app.stockage.images.chemin=${IMAGES_DIR:./uploads/images}

# ==========================================
# STOCKAGE DES PREUVES (Section 5.2)
# ==========================================
app.stockage.preuves.chemin=${UPLOAD_DIR:./uploads/preuves}
# Capture de paiement : 5 Mo maximum (§5.5)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================================
# MAIL / SMTP (RG-01)
# ==========================================
# Aucune valeur par défaut : à renseigner dans .env (ex. SMTP de l'établissement ou Gmail + mot de passe d'application)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
# Adresse d'expédition (par défaut l'identifiant SMTP) et nom affiché
app.mail.expediteur=${MAIL_EXPEDITEUR:${SMTP_USERNAME:}}
app.mail.nom-expediteur=${MAIL_NOM_EXPEDITEUR:IPNET Billetterie}
# Fréquence de traitement de l'outbox (ms)
app.notification.intervalle-ms=5000

# ==========================================
# RÉSERVATIONS (EF-24)
# ==========================================
app.reservation.expiration-heures=${RESERVATION_EXPIRATION_HEURES:48}

# ==========================================
# PREMIER ÉVÉNEMENT (créé et publié au premier démarrage si aucun événement n'existe ;
# ensuite modifiable uniquement par l'administrateur depuis l'interface)
# ==========================================
app.premier-evenement.actif=true
app.premier-evenement.titre=JPOPE 2026 \u2013 Journ\u00E9e Portes Ouvertes Projets \u00C9tudiants
app.premier-evenement.description=Innovation \u00B7 Exp\u00E9rience \u00B7 Pratique. Les \u00E9tudiants d'IPNET Institute of Technology pr\u00E9sentent leurs projets : d\u00E9monstrations, pr\u00E9sentations et \u00E9changes avec les \u00E9quipes, les enseignants, les parents et les entreprises.
app.premier-evenement.date-debut=2026-12-05T18:30:00
app.premier-evenement.lieu=IPNET Institute of Technology, Lom\u00E9
app.premier-evenement.prix=500
app.premier-evenement.devise=XOF
app.premier-evenement.capacite=300
app.premier-evenement.image=seed/jpope-2026.jpg

# ==========================================
# TÂCHES PLANIFIÉES
# ==========================================
spring.task.scheduling.pool.size=2

# ==========================================
# SPRINGDOC OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
