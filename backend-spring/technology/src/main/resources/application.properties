spring.application.name=IPNET_EVENT_APP
spring.profiles.include=local
server.port=8080

# ==========================================
# BASE DE DONNÉES & POOL HIKARI
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ipnet_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# FLYWAY & JPA
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# SÉCURITÉ & SECRETS (Section 5.3 OWASP)
# ==========================================
app.security.jwt.secret=${JWT_SECRET:ipnet_billetterie_jwt_secret_key_minimum_256_bits_length_for_hmac_sha256!}
app.security.qr.hmac-secret=${QR_HMAC_SECRET:ipnet_billetterie_super_secret_hmac_key_2026_safe_protection}

# ==========================================
# STOCKAGE DES PREUVES (Section 5.2)
# ==========================================
app.stockage.preuves.chemin=${UPLOAD_DIR:./uploads/preuves}

# ==========================================
# MAIL / SMTP DE L'ÉTABLISSEMENT (RG-01)
# ==========================================
spring.mail.host=${SMTP_HOST:smtp.ipnetinstitute.tg}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:billetterie@ipnetinstitute.tg}
spring.mail.password=${SMTP_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# TÂCHES PLANIFIÉES
# ==========================================
spring.task.scheduling.pool.size=2

# ==========================================
# SPRINGDOC OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
