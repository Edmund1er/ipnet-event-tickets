# Blueprint Render — backend Spring Boot (Docker).
# Render > New > Blueprint > choisir ce dépôt. Les variables « sync: false » sont saisies une fois dans le tableau de bord.
services:
  - type: web
    name: ipnet-event-backend
    runtime: docker
    region: frankfurt
    plan: free
    # Chemins relatifs à la racine du dépôt
    dockerfilePath: ./backend-spring/technology/Dockerfile
    dockerContext: ./backend-spring/technology
    healthCheckPath: /v3/api-docs
    # CI/CD : Render ne déploie un push sur main que si les contrôles GitHub Actions (tests) sont verts
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Base Supabase (pooler session)
      - key: DB_URL
        value: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_USERNAME
        value: postgres.kfcsxgecjguodhcpknzd
      - key: DB_PASSWORD
        sync: false
      # Secrets générés par Render
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      # Front
      - key: FRONT_URL
        sync: false
      - key: CORS_ORIGINES
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_EXPEDITEUR
        sync: false
      - key: TELEPHONE_REGION
        value: TG
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
