<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Escapade nature</title>
<link rel="stylesheet" href="style.css">
<style>
/* ---- Habillage FORET : verts profonds, terre et bois ---- */
:root{--f-vert:#1f3d2b;--f-vert2:#2f5d3f;--f-mousse:#6b8f4e;--f-terre:#8a5a3b;--f-bois:#c9a77c;--f-creme:#f4efe3;--f-encre:#23301f}
body{background:var(--f-creme);color:var(--f-encre);font-family:Georgia,"Palatino Linotype","Book Antiqua",serif;overflow-x:hidden}
h1,h2,h3,h4,h5,h6,.palatin-btn,.classynav a{font-family:Georgia,"Palatino Linotype",serif}
p{line-height:1.8}
.preloader{display:none!important}
.header-area,.palatin-main-menu,.classy-nav-container{background:rgba(24,45,32,.92)!important}
.classynav,.classynav ul,.classynav>ul>li{background:transparent!important}
.classynav>ul>li>a{color:#f4efe3!important;letter-spacing:.04em;opacity:1!important}
.classynav ul li.active>a,.classynav ul li a:hover{color:var(--f-bois)!important}
.palatin-btn,.btn.palatin-btn{background:var(--ipnet-button,var(--f-terre))!important;border:1px solid var(--ipnet-button,var(--f-terre))!important;color:#fff!important;border-radius:999px 999px 999px 8px;letter-spacing:.06em;text-transform:none}
.palatin-btn:hover{filter:brightness(1.12)}
.section-heading h2{color:var(--f-vert);font-style:italic;font-weight:700}
.section-heading .line-{background:var(--f-mousse)!important}
.hero-area,.single-hero-slide{min-height:min(88vh,760px)}
.single-hero-slide .slide-img{background-size:cover;background-position:center}
.single-hero-slide .slide-img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,34,22,.35),rgba(14,34,22,.78))}
.hero-slides-content{position:relative;z-index:2;opacity:1!important}
.hero-slides-content h2{color:#f4efe3;font-style:italic;text-shadow:0 2px 18px rgba(0,0,0,.4);overflow-wrap:anywhere}
.hero-slides-content p{color:#e6e0cc}
.hero-slides-content .line{background:var(--f-bois)!important}
.about-us-area{background:var(--f-creme)}
.about-text p{color:#3b4a35}
.about-thumbnail img{border-radius:18px 18px 18px 4px;box-shadow:0 12px 30px rgba(31,61,43,.25)}
.rooms-area,.foret-intervenants{background:#e9e2cf}
.single-rooms-area{border-radius:18px;overflow:hidden;background:#fbf8ef;box-shadow:0 10px 28px rgba(60,45,25,.18);margin-bottom:30px}
.single-rooms-area .price-from{background:var(--f-vert)!important;color:#f4efe3!important}
.rooms-text h4{color:var(--f-vert);font-style:italic}
.rooms-text p{color:#3b4a35}
.foret-programme{background:var(--f-creme)}
.foret-jour{max-width:860px;margin:0 auto 38px}
.foret-jour-titre{color:var(--f-terre);font-style:italic;border-bottom:2px dotted var(--f-bois);padding-bottom:10px;margin-bottom:6px;font-size:1.5rem}
.foret-lignes{list-style:none;margin:0;padding:0}
.foret-ligne{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid rgba(138,90,59,.2)}
.foret-heure{flex:0 0 130px;font-weight:700;color:var(--f-vert2);padding-top:2px}
.foret-corps{display:flex;gap:14px;align-items:flex-start;min-width:0}
.foret-corps h4{margin:0 0 4px;color:var(--f-vert);font-size:1.15rem;overflow-wrap:anywhere}
.foret-corps p{margin:0;color:#4b5a44;font-size:.95rem}
.foret-ligne[data-ipnet]{cursor:pointer}
.foret-ligne[data-ipnet]:hover h4{color:var(--f-terre)}
.contact-area,.contact-info{background:var(--f-vert)}
.contact-info{color:#e6e0cc}
.contact-info h2,.contact-info h4,.contact-info h5,.contact-info p{color:#f4efe3}
.contact-area .home-map-area iframe{border:0;width:100%;height:100%;min-height:360px}
.footer-area{background:#14261a;color:#cfc8b0}
.footer-area p,.footer-area h6{color:#cfc8b0}
.foret-logo{color:#f4efe3;font-size:1.6rem;font-style:italic}
.ipnet-mobile-ticket-cta{background:var(--f-terre)!important}
@media(max-width:991px){
 .hero-area,.single-hero-slide{min-height:70vh}
 .classynav ul li a{color:#23301f!important}
 .contact-info{padding:40px 20px}
}
@media(max-width:575px){
 .foret-ligne{flex-direction:column;gap:4px}
 .foret-heure{flex:none}
 .hero-slides-content h2{font-size:2rem}
 .section-heading h2{font-size:1.7rem}
}
</style>
</head>
<body>
<div class="preloader"></div>

<header class="header-area">
 <div class="palatin-main-menu">
  <div class="classy-nav-container breakpoint-off">
   <div class="container">
    <nav class="classy-navbar justify-content-between" id="palatinNav">
     <a href="#" class="nav-brand"></a>
     <div class="classy-navbar-toggler"><span class="navbarToggler"><span></span><span></span><span></span></span></div>
     <div class="classy-menu">
      <div class="classycloseIcon"><div class="cross-wrap"><span class="top"></span><span class="bottom"></span></div></div>
      <div class="classynav">
       <ul><li class="active"><a href="#">Accueil</a></li></ul>
       <div class="menu-btn"><a href="#" class="btn palatin-btn">Réserver</a></div>
      </div>
     </div>
    </nav>
   </div>
  </div>
 </div>
</header>

<section class="hero-area" id="hero">
 <div class="hero-slides owl-carousel">
  <div class="single-hero-slide d-flex align-items-center justify-content-center">
   <div class="slide-img bg-img" style="background-image: url(img/bg-img/bg-1.jpg);"></div>
   <div class="container">
    <div class="row justify-content-center">
     <div class="col-12 col-lg-9">
      <div class="hero-slides-content">
       <div class="line"></div>
       <h2>Titre</h2>
       <p class="foret-accroche"></p>
       <a href="#" class="btn palatin-btn mt-50 foret-hero-btn">Réserver</a>
      </div>
     </div>
    </div>
   </div>
  </div>
 </div>
</section>

<section class="about-us-area section-padding-100" id="apropos">
 <div class="container">
  <div class="row align-items-center">
   <div class="col-12 col-lg-6 foret-col-texte">
    <div class="about-text text-center mb-100">
     <div class="section-heading text-center"><div class="line-"></div><h2>À propos</h2></div>
     <p class="foret-texte"></p>
     <a href="#" class="btn palatin-btn mt-50 foret-btn">Réserver</a>
    </div>
   </div>
   <div class="col-12 col-lg-6 foret-col-image">
    <div class="about-thumbnail mb-100" style="position:relative">
     <img class="foret-image" src="img/bg-img/5.jpg" alt="" style="width:100%;height:auto;max-height:520px;object-fit:cover">
    </div>
   </div>
  </div>
 </div>
</section>

<section class="foret-intervenants rooms-area section-padding-100" id="intervenants">
 <div class="container">
  <div class="row justify-content-center">
   <div class="col-12 col-lg-8"><div class="section-heading text-center"><div class="line-"></div><h2>Intervenants</h2><p></p></div></div>
  </div>
  <div class="row justify-content-center">
   <div class="col-12 col-md-6 col-lg-4 foret-carte">
    <div class="single-rooms-area">
     <div class="bg-thumbnail bg-img" style="background-image: url(img/bg-img/1.jpg);background-position:center top"></div>
     <div class="rooms-text"><div class="line"></div><h4>Nom</h4><p>Rôle</p></div>
    </div>
   </div>
  </div>
 </div>
</section>

<section class="foret-programme section-padding-100" id="programme">
 <div class="container">
  <div class="section-heading text-center"><div class="line-"></div><h2>Programme</h2><p></p></div>
  <div class="foret-jour">
   <h3 class="foret-jour-titre"></h3>
   <ul class="foret-lignes">
    <li class="foret-ligne"><span class="foret-heure"></span><div class="foret-corps"><div><h4></h4><p></p></div></div></li>
   </ul>
  </div>
 </div>
</section>

<section class="rooms-area section-padding-100" id="billets">
 <div class="container">
  <div class="row justify-content-center">
   <div class="col-12 col-lg-8"><div class="section-heading text-center"><div class="line-"></div><h2>Billets</h2></div></div>
  </div>
  <div class="row justify-content-center">
   <div class="col-12 col-md-6 col-lg-4 foret-offre">
    <div class="single-rooms-area" style="padding-bottom:70px">
     <div class="bg-thumbnail bg-img" style="background-image: url(img/bg-img/8.jpg);"></div>
     <p class="price-from">Prix</p>
     <div class="rooms-text"><div class="line"></div><h4>Offre</h4><p></p></div>
     <a href="#" class="book-room-btn btn palatin-btn">Réserver</a>
    </div>
   </div>
  </div>
 </div>
</section>

<section class="contact-area d-flex flex-wrap align-items-center" id="lieu">
 <div class="home-map-area"></div>
 <div class="contact-info">
  <div class="section-heading"><div class="line-"></div><h2>Lieu</h2><p></p></div>
  <h4 class="foret-adresse"></h4>
  <h5 class="foret-tel"></h5>
  <h5 class="foret-email"></h5>
 </div>
</section>

<footer class="footer-area">
 <div class="container">
  <div class="row">
   <div class="col-12 col-lg-8"><div class="footer-widget-area mt-50"><div class="foret-logo"></div><p class="foret-pied"></p></div></div>
   <div class="col-12"><div class="copywrite-text mt-30"><p class="foret-date"></p></div></div>
  </div>
 </div>
</footer>

<script src="js/jquery/jquery-2.2.4.min.js"></script>
<script src="js/bootstrap/popper.min.js"></script>
<script src="js/bootstrap/bootstrap.min.js"></script>
<script src="js/plugins/plugins.js"></script>
<script src="js/active.js"></script>
</body>
</html>
