<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lagon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link href="https://fonts.googleapis.com/css?family=Nunito+Sans:300,400,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
<link rel="stylesheet" href="css/animate.css">
<link rel="stylesheet" href="css/owl.carousel.min.css">
<link rel="stylesheet" href="css/owl.theme.default.min.css">
<link rel="stylesheet" href="css/magnific-popup.css">
<link rel="stylesheet" href="css/aos.css">
<link rel="stylesheet" href="css/ionicons.min.css">
<link rel="stylesheet" href="css/flaticon.css">
<link rel="stylesheet" href="css/icomoon.css">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--mer:#00b4c8;--mer-fonce:#007f94;--corail:#ff5a5f;--soleil:#ffd23f;--sable:#fff6dc;--ciel:#e6fbff;--encre:#06323d}
html{scroll-behavior:smooth}
body{font-family:'Nunito Sans','Segoe UI',Arial,sans-serif!important;color:var(--encre)!important;background:var(--sable)!important;overflow-x:hidden}
.ftco-animate{opacity:1!important;visibility:visible!important}
#ftco-navbar{position:sticky!important;top:0;background:linear-gradient(90deg,var(--mer),#00d4c0)!important;box-shadow:0 6px 20px rgba(0,128,148,.35);border-bottom:4px solid var(--soleil)}
#ftco-navbar .navbar-brand{color:#fff!important;font-weight:800;font-size:1.5rem;text-transform:none}
#ftco-navbar .navbar-brand span{color:var(--soleil)!important}
#ftco-navbar .nav-link{color:#fff!important;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.82rem}
#ftco-navbar .nav-link:hover,#ftco-navbar .nav-item.active .nav-link{color:var(--soleil)!important}
.hero,.home-slider,.home-slider .slider-item{height:auto!important}
.home-slider .slider-item{min-height:78vh;display:flex;align-items:center;background-size:cover;background-position:center;position:relative;padding:90px 0 130px;background-color:var(--mer)}
.home-slider .overlay{position:absolute;top:0;right:0;bottom:0;left:0;opacity:1!important;background:linear-gradient(160deg,rgba(0,180,200,.78),rgba(255,90,95,.45) 70%,rgba(255,210,63,.4))!important}
.home-slider .slider-item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:70px;background:var(--sable);clip-path:ellipse(75% 100% at 50% 100%)}
.home-slider .slider-text{height:auto!important;position:relative;z-index:2}
.home-slider .text{color:#fff}
.home-slider h2{color:var(--soleil)!important;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:1rem}
.home-slider h1{color:#fff!important;font-weight:800;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.08;text-shadow:0 4px 18px rgba(0,60,80,.4)}
.lagon-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.lagon-meta span{background:#fff;color:var(--mer-fonce);font-weight:800;border-radius:999px;padding:8px 16px;box-shadow:0 6px 16px rgba(0,60,80,.25)}
.lagon-meta span:nth-child(2){background:var(--soleil);color:var(--encre)}
.ipnet-hero-cta,.lagon-btn,.btn-secondary,.btn-primary{background:var(--corail)!important;border:0!important;color:#fff!important;font-weight:800;border-radius:999px!important;padding:14px 30px;box-shadow:0 10px 24px rgba(255,90,95,.45);text-decoration:none!important;display:inline-block}
.ipnet-hero-cta:hover,.lagon-btn:hover{filter:brightness(1.08)}
.ftco-section{padding:5em 0;background:transparent}
.heading-section .subheading{color:var(--corail)!important;font-weight:800;text-transform:uppercase;letter-spacing:.2em;font-size:.85rem}
.heading-section h2{color:var(--mer-fonce)!important;font-weight:800;font-size:clamp(1.7rem,4vw,2.6rem)}
.heading-section h2::after{content:"";display:block;width:70px;height:6px;border-radius:6px;margin:14px 0 0;background:linear-gradient(90deg,var(--corail),var(--soleil))}
.text-center.heading-section h2::after{margin-left:auto;margin-right:auto}
.ftco-wrap-about{background:var(--ciel)}
.ftco-wrap-about .img{min-height:360px;background-size:cover;background-position:center;border-radius:28px;border:6px solid #fff;box-shadow:0 14px 34px rgba(0,128,148,.25)}
.ftco-wrap-about .img-2{transform:translateY(34px)}
.ftco-wrap-about p{line-height:1.8}
.lagon-section{padding:4.5em 0}
.lagon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.lagon-speaker{text-align:center;background:#fff;border-radius:26px;padding:26px 16px;box-shadow:0 12px 28px rgba(0,128,148,.15);border-bottom:6px solid var(--soleil)}
.lagon-speaker:nth-child(3n+2){border-bottom-color:var(--corail)}
.lagon-speaker:nth-child(3n){border-bottom-color:var(--mer)}
.lagon-speaker img{width:130px;height:130px;object-fit:cover;border-radius:50%;border:5px solid var(--mer);margin-bottom:14px}
.lagon-speaker h3{font-size:1.15rem;font-weight:800;color:var(--encre);margin:0 0 4px}
.lagon-speaker p{margin:0;color:var(--corail);font-weight:700}
.lagon-programme{background:linear-gradient(180deg,var(--ciel),var(--sable))}
.lagon-jour h3{display:inline-block;background:var(--mer);color:#fff;font-weight:800;border-radius:999px;padding:8px 22px;margin:24px 0 16px}
.lagon-ligne{display:flex;gap:18px;align-items:center;background:#fff;border-radius:20px;padding:16px 20px;margin-bottom:14px;border-left:8px solid var(--corail);box-shadow:0 8px 20px rgba(0,128,148,.12)}
.lagon-ligne:nth-child(even){border-left-color:var(--soleil)}
.lagon-ligne img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.lagon-ligne .heure{flex:none;min-width:130px;font-weight:800;color:var(--mer-fonce)}
.lagon-ligne h4{margin:0;font-size:1.1rem;font-weight:800;color:var(--encre)}
.lagon-ligne p{margin:4px 0 0;color:#3c6670}
.lagon-offres{background:var(--mer);color:#fff;position:relative}
.lagon-offres .heading-section h2{color:#fff!important}
.lagon-offres .heading-section .subheading{color:var(--soleil)!important}
.lagon-offre{background:#fff;color:var(--encre);border-radius:28px;padding:30px 24px;text-align:center;height:100%;box-shadow:0 16px 34px rgba(0,60,80,.3);display:flex;flex-direction:column}
.lagon-offre h3{font-weight:800;color:var(--mer-fonce)}
.lagon-offre .prix{font-size:2.2rem;font-weight:800;color:var(--corail);margin:6px 0 12px}
.lagon-offre ul{list-style:none;padding:0;margin:0 0 20px;flex:1}
.lagon-offre li{padding:6px 0;border-bottom:1px dashed #bfe9ef}
.lagon-lieu .adresse{font-size:1.1rem;line-height:1.8}
.lagon-lieu .carte{border-radius:28px;overflow:hidden;border:6px solid #fff;box-shadow:0 14px 34px rgba(0,128,148,.25);min-height:320px;background:var(--ciel)}
.lagon-lieu .carte iframe{display:block}
.ftco-footer{background:var(--encre)!important;color:#d6f4f8;padding:3em 0 2em;border-top:8px solid var(--soleil)}
.ftco-footer h2{color:var(--soleil)!important;font-weight:800;font-size:1.3rem}
.ftco-footer p{color:#d6f4f8}
@media(max-width:767px){
.home-slider .slider-item{min-height:68vh;padding:60px 0 110px}
.lagon-section,.ftco-section{padding:3em 0}
.lagon-ligne{flex-direction:column;align-items:flex-start;gap:8px}
.ftco-wrap-about .img{min-height:240px}
.ftco-wrap-about .img-2{transform:none;margin-top:12px}
.ftco-wrap-about .d-flex{flex-direction:column}
#ftco-navbar .navbar-collapse{background:var(--mer-fonce);border-radius:16px;padding:10px 16px;margin-top:8px}
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark ftco_navbar ftco-navbar-light" id="ftco-navbar">
  <div class="container">
    <a class="navbar-brand" href="#hero">Lagon</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Menu"><span class="oi oi-menu"></span> Menu</button>
    <div class="collapse navbar-collapse" id="ftco-nav">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active"><a href="#hero" class="nav-link">Accueil</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="hero" id="hero">
  <section class="home-slider">
    <div class="slider-item" style="background-image:url(images/bg_1.jpg);">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text align-items-center">
          <div class="col-lg-8">
            <div class="text">
              <h2 class="lagon-accroche"></h2>
              <h1 class="mb-3 lagon-titre"></h1>
              <div class="lagon-meta"><span class="lagon-date"></span><span class="lagon-lieu-hero"></span></div>
              <div class="lagon-hero-action"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<section class="ftco-section ftco-wrap-about" id="apropos">
  <div class="container">
    <div class="row no-gutters">
      <div class="col-md-7 order-md-last d-flex">
        <div class="img img-1 mr-md-2" style="background-image:url(images/about-1.jpg);"></div>
        <div class="img img-2 ml-md-2" style="background-image:url(images/about-2.jpg);"></div>
      </div>
      <div class="col-md-5 wrap-about pr-md-5">
        <div class="heading-section mb-4 my-5 my-md-0">
          <span class="subheading"></span>
          <h2 class="mb-4"></h2>
        </div>
        <p class="lagon-texte"></p>
        <p><a href="#" class="btn btn-secondary rounded lagon-bouton"></a></p>
      </div>
    </div>
  </div>
</section>

<section class="lagon-section" id="intervenants">
  <div class="container">
    <div class="heading-section text-center mb-5">
      <span class="subheading">Ils sont là</span>
      <h2 class="lagon-titre-section"></h2>
    </div>
    <div class="lagon-grid">
      <article class="lagon-speaker"><img src="images/staff-1.jpg" alt=""><h3></h3><p></p></article>
    </div>
  </div>
</section>

<section class="lagon-section lagon-programme" id="programme">
  <div class="container">
    <div class="heading-section text-center mb-4">
      <span class="subheading">Au programme</span>
      <h2 class="lagon-titre-section"></h2>
    </div>
    <div class="lagon-jours">
      <div class="lagon-jour">
        <h3></h3>
        <div class="lagon-lignes">
          <div class="lagon-ligne">
            <img src="images/staff-2.jpg" alt="">
            <div class="heure"></div>
            <div class="corps"><h4></h4><p></p></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="lagon-section lagon-offres" id="billets">
  <div class="container">
    <div class="heading-section text-center mb-5">
      <span class="subheading">Votre place</span>
      <h2 class="lagon-titre-offres">Réservez votre place</h2>
    </div>
    <div class="row justify-content-center lagon-offres-liste">
      <div class="col-md-6 col-lg-4 mb-4 lagon-col">
        <div class="lagon-offre"><h3></h3><div class="prix"></div><ul><li></li></ul><a href="#" class="lagon-btn"></a></div>
      </div>
    </div>
  </div>
</section>

<section class="lagon-section lagon-lieu" id="lieu">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-5 mb-4">
        <div class="heading-section mb-4">
          <span class="subheading">On se retrouve</span>
          <h2 class="lagon-titre-lieu"></h2>
        </div>
        <p class="adresse"></p>
        <p class="lagon-texte-lieu"></p>
      </div>
      <div class="col-md-7"><div class="carte"></div></div>
    </div>
  </div>
</section>

<footer class="ftco-footer">
  <div class="container">
    <div class="row">
      <div class="col-md-6 mb-3"><h2 class="ftco-heading-2 lagon-pied-nom"></h2><p class="lagon-pied-date"></p></div>
      <div class="col-md-6 mb-3"><h2 class="ftco-heading-2">Contact</h2><p class="lagon-pied-contact"></p></div>
    </div>
  </div>
</footer>

<script src="js/jquery.min.js"></script>
<script src="js/jquery-migrate-3.0.1.min.js"></script>
<script src="js/popper.min.js"></script>
<script src="js/bootstrap.min.js"></script>
</body>
</html>
